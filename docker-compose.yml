services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tenure-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tenure_user}:${DB_PASSWORD:-tenure_password}@postgres:5432/${DB_NAME:-tenure_db}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - tenure-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenure-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-tenure_user}:${DB_PASSWORD:-tenure_password}@postgres:5432/${DB_NAME:-tenure_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY:-}
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID:-}
      MSG91_WIDGET_TOKEN_AUTH: ${MSG91_WIDGET_TOKEN_AUTH:-}
    ports:
      - "5000:5000"
    networks:
      - tenure-network

  postgres:
    image: postgres:16-alpine
    container_name: tenure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tenure_db}
      POSTGRES_USER: ${DB_USER:-tenure_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tenure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tenure_user} -d ${DB_NAME:-tenure_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenure-network

volumes:
  postgres-data:

networks:
  tenure-network:
    driver: bridge
